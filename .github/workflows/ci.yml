name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pacote: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.pacote }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pacote }}/package-lock.json
      - run: npm ci
      - run: npm run build
